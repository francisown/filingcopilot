[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filingcopilot"
version = "1.0.0"
description = "Company filings, financial calculations and stock research with traceable sources"
authors = [{name = "francisown"}]
keywords = ["financial-analysis", "stock-research", "sec-edgar", "rag", "mcp"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5", "fastapi>=0.115,<1", "httpx>=0.27,<1",
  "langgraph>=0.3,<2", "mcp>=1.20,<2", "numpy>=1.26,<3",
  "openai>=1.60,<3", "pydantic>=2.10,<3", "python-dotenv>=1,<2",
  "uvicorn>=0.30,<1", "tzdata>=2025.1"
]

[project.optional-dependencies]
semantic = ["fastembed>=0.4,<1"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
filingcopilot = "filingcopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filingcopilot = ["static/*", "samples/*.json", "domain-defaults.json", "stock-directory.json", "peer-groups.json", "locale-en.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = ["slow: full integration, database/service fixtures, concurrency, subprocesses or expensive indexing; excluded from the unit/rules CI gate"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
