name: FilingCopilot verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    # One full test run per cell; the cold/warm duplicate run was removed.
    timeout-minutes: 40
    env:
      FC_EMBEDDING_MODE: 'off'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev,semantic,evaluation]' wheel
      - run: python -c "from importlib.metadata import version; from filingcopilot import __version__; assert version('filingcopilot') == __version__, (version('filingcopilot'), __version__)"
      - run: python -m ruff check src scripts tests
      - run: python scripts/check_mcp_readme_tools.py
      - run: python scripts/build_locale_catalog.py --check
      - run: python scripts/check_retrieval_gold.py
      - run: python scripts/run_quality_checks.py --profile regression --output artifacts/ci/regression.json
      - run: python scripts/check_midnight_fixtures.py
      - run: python scripts/run_quality_checks.py --profile frontend --output artifacts/ci/frontend.json
      - name: Validate local container
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.10'
        env:
          FC_AUTH_TOKEN: ci-validation-token
        run: |
          docker compose config --quiet
          docker build --tag filingcopilot-ci .
      - run: python scripts/smoke_mcp.py --output artifacts/ci/mcp-smoke.json
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python scripts/build_verifier_distribution.py
      - name: Validate application wheel
        shell: bash
        run: |
          version=$(python -c 'from filingcopilot import __version__; print(__version__)')
          python scripts/validate_application_distribution.py \
            --wheel "dist/filingcopilot-${version}-py3-none-any.whl" \
            --output artifacts/ci/application-wheel.json
      - name: Validate verifier wheel
        shell: bash
        run: |
          version=$(python -c 'from filingcopilot import __version__; print(__version__)')
          python scripts/validate_verifier_wheel.py \
            --wheel "dist/filingcopilot_verify-${version}-py3-none-any.whl" \
            --output artifacts/ci/verifier-wheel.json
      - name: Summarize Python check failures
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path artifacts/ci) {
            $reports = Get-ChildItem artifacts/ci -File -ErrorAction SilentlyContinue | Sort-Object Name
            foreach ($report in $reports) {
              Write-Host "===== $($report.Name) ====="
              if ($report.Extension -eq '.txt') {
                Get-Content -LiteralPath $report.FullName -Tail 80
              } else {
                Get-Content -LiteralPath $report.FullName
              }
            }
          }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            artifacts/ci/**
            dist/*.whl
