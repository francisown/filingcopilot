services:
  filingcopilot:
    build: .
    ports:
      - "127.0.0.1:${FC_PORT:-8159}:8123"
    environment:
      FC_HOME: /app/data
      FC_API_BASE: "${FC_API_BASE:-}"
      FC_API_KEY: "${FC_API_KEY:-}"
      FC_AUTH_TOKEN: "${FC_AUTH_TOKEN:?FC_AUTH_TOKEN must be set for the non-loopback container}"
      FC_MODEL: "${FC_MODEL:-}"
      FC_REVIEW_MODEL: "${FC_REVIEW_MODEL:-}"
      FC_SEC_USER_AGENT: "${FC_SEC_USER_AGENT:-}"
      FC_EXTRA_HEADERS: "${FC_EXTRA_HEADERS:-}"
      FC_SESSION_ID: "${FC_SESSION_ID:-}"
      FC_EMBEDDING_MODE: "${FC_EMBEDDING_MODE:-off}"
      FC_EMBEDDING_MODEL: "${FC_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}"
      FC_RERANK_MODE: "${FC_RERANK_MODE:-coverage}"
      FC_MAX_ROUNDS: "${FC_MAX_ROUNDS:-8}"
      FC_MAX_TOOL_CALLS: "${FC_MAX_TOOL_CALLS:-20}"
      FC_MODEL_MAX_TOKENS: "${FC_MODEL_MAX_TOKENS:-8192}"
      FC_REVIEW_MAX_TOKENS: "${FC_REVIEW_MAX_TOKENS:-8192}"
      FC_REVIEW_BATCH_SIZE: "${FC_REVIEW_BATCH_SIZE:-2}"
      FC_MIN_MODEL_INTERVAL: "${FC_MIN_MODEL_INTERVAL:-21}"
      FC_MODEL_TIMEOUT: "${FC_MODEL_TIMEOUT:-60}"
      FC_MODEL_TEMPERATURE: "${FC_MODEL_TEMPERATURE:-}"
      FC_MODEL_TOP_P: "${FC_MODEL_TOP_P:-}"
      FC_MODEL_SEED: "${FC_MODEL_SEED:-}"
      FC_RESEARCH_TIMEOUT: "${FC_RESEARCH_TIMEOUT:-3000}"
      FC_REVIEW_RESERVE_SECONDS: "${FC_REVIEW_RESERVE_SECONDS:-30}"
      FC_REFRESH_TIMEOUT: "${FC_REFRESH_TIMEOUT:-20}"
      FC_MODEL_ATTEMPTS: "${FC_MODEL_ATTEMPTS:-3}"
      FC_RETRY_BASE_DELAY: "${FC_RETRY_BASE_DELAY:-1}"
      FC_RETRY_MAX_DELAY: "${FC_RETRY_MAX_DELAY:-60}"
      FC_MODEL_INPUT_PRICE_PER_MILLION: "${FC_MODEL_INPUT_PRICE_PER_MILLION:-}"
      FC_MODEL_OUTPUT_PRICE_PER_MILLION: "${FC_MODEL_OUTPUT_PRICE_PER_MILLION:-}"
      FC_MAX_COST_USD: "${FC_MAX_COST_USD:-}"
      FC_DOMAIN_CONFIG: "${FC_DOMAIN_CONFIG:-}"
      FC_TWELVE_DATA_API_KEY: "${FC_TWELVE_DATA_API_KEY:-}"
    volumes:
      - filingcopilot-data:/app/data
    restart: unless-stopped

volumes:
  filingcopilot-data:
