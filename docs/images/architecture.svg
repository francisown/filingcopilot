<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">FilingCopilot evidence flow</title>
  <desc id="desc">Questions from the browser, CLI, REST API, or MCP reach one research service. The service plans a budget, runs a LangGraph tool-using agent, retrieves passages, and records evidence in a ledger. Deterministic gates and semantic review check the claims. The answer and gaps are frozen into a SHA256 package and re-checked by a standalone offline verifier.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="820" fill="#f8fafc"/>

  <text x="52" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="650" fill="#0f172a">FilingCopilot — evidence flow</text>
  <text x="52" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">One research service. Four interfaces. Every answer traceable and re-checkable offline.</text>

  <!-- Interfaces panel -->
  <rect x="40" y="96" width="340" height="560" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="58" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#4338ca">INTERFACES</text>

  <rect x="58" y="136" width="304" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="210" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a">Browser workspace</text>

  <rect x="58" y="198" width="304" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="210" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a">CLI</text>

  <rect x="58" y="260" width="304" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="210" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a">REST API</text>

  <rect x="58" y="322" width="304" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="210" y="352" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#0f172a">MCP · 30 tools</text>

  <text x="58" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#475569">SUPPORT</text>

  <rect x="58" y="422" width="304" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="210" y="448" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Domain and stock registry</text>
  <text x="210" y="469" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">company identity · aliases · metrics</text>

  <rect x="58" y="498" width="304" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="210" y="524" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Market router and caches</text>
  <text x="210" y="545" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">prices · filings · external updates</text>

  <!-- Research panel -->
  <rect x="410" y="96" width="500" height="560" rx="16" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="428" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#0f766e">RESEARCH RUNTIME</text>

  <rect x="440" y="136" width="440" height="58" rx="10" fill="#ffffff" stroke="#5eead4" filter="url(#shadow)"/>
  <text x="660" y="161" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#0f172a">Research service</text>
  <text x="660" y="181" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">one lifecycle for every interface</text>

  <rect x="440" y="216" width="440" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="660" y="241" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#0f172a">Capability plan and budget</text>
  <text x="660" y="261" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">deadline · rounds · tool calls · review</text>

  <rect x="440" y="296" width="440" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="660" y="321" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#0f172a">Tool-using agent · LangGraph</text>
  <text x="660" y="341" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">retrieve · calculate · draft · submit claims</text>

  <rect x="440" y="376" width="440" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="660" y="401" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#0f172a">Hybrid retrieval</text>
  <text x="660" y="421" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">SQLite FTS5 + optional local embeddings</text>

  <rect x="440" y="456" width="440" height="62" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="660" y="481" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#0f766e">Evidence ledger</text>
  <text x="660" y="501" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">facts · calculations · locators · source hashes</text>

  <text x="660" y="552" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">The ledger is the source of truth, not the chat transcript.</text>
  <text x="660" y="574" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Every citation points to a stored object.</text>

  <!-- Verification panel -->
  <rect x="940" y="96" width="420" height="620" rx="16" fill="#fffbeb" stroke="#fde68a"/>
  <text x="958" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#b45309">VERIFICATION &amp; OUTPUT</text>

  <rect x="960" y="136" width="380" height="62" rx="10" fill="#ffffff" stroke="#f59e0b" filter="url(#shadow)"/>
  <text x="1150" y="161" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#0f172a">Deterministic gates</text>
  <text x="1150" y="181" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">numeric · scope · direction · completeness</text>

  <rect x="960" y="216" width="380" height="62" rx="10" fill="#ffffff" stroke="#f59e0b" filter="url(#shadow)"/>
  <text x="1150" y="241" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#0f172a">Semantic review</text>
  <text x="1150" y="261" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">subject · period · materiality · evidence scope</text>

  <rect x="960" y="296" width="380" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="1150" y="321" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#92400e">Answer + explicit gaps</text>
  <text x="1150" y="341" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">no silent completeness</text>

  <rect x="960" y="376" width="380" height="62" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="1150" y="401" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#0f766e">Frozen research package</text>
  <text x="1150" y="421" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">claims · citations · calculations · SHA256 manifest</text>

  <rect x="960" y="456" width="380" height="62" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="1150" y="481" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" fill="#0f766e">Offline verifier</text>
  <text x="1150" y="501" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">package hash · document hash · quote span</text>

  <rect x="960" y="548" width="380" height="138" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1150" y="574" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Verification is independent</text>
  <text x="1150" y="598" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">no agent · no model · no network</text>
  <text x="1150" y="622" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">A consistent package proves the checks</text>
  <text x="1150" y="642" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">requested; it does not certify a decision.</text>
  <text x="1150" y="666" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Failures stay visible in the repository.</text>

  <!-- Arrows: interfaces to service -->
  <path d="M 362 232 L 388 232 L 388 165 L 432 165" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="396" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">same request</text>

  <!-- Research flow -->
  <path d="M 660 194 L 660 216" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 660 274 L 660 296" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 660 354 L 660 376" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 660 434 L 660 456" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="672" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f766e">evidence</text>

  <!-- Ledger to gates -->
  <path d="M 880 487 L 912 487 L 912 167 L 952 167" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="892" y="474" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f766e">claims</text>

  <!-- Verification flow -->
  <path d="M 1150 198 L 1150 216" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 1150 278 L 1150 296" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 1150 358 L 1150 376" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <path d="M 1150 438 L 1150 456" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-accent)"/>
  <text x="1162" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f766e">freeze</text>
  <text x="1162" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#0f766e">re-check</text>

  <!-- Support to ledger -->
  <path d="M 362 453 L 396 453 L 396 478 L 432 478" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 362 529 L 396 529 L 396 496 L 432 496" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bottom invariants -->
  <rect x="40" y="690" width="410" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="650" fill="#0f172a">Traceable</text>
  <text x="58" y="735" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">filing · period · currency · unit · locator</text>

  <rect x="470" y="690" width="410" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="488" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="650" fill="#0f172a">Reproducible</text>
  <text x="488" y="735" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">frozen inputs · canonical JSON · SHA256</text>

  <rect x="900" y="690" width="460" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="918" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="650" fill="#0f172a">Honest evaluation</text>
  <text x="918" y="735" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">self-reviewed · Recall@5 0.26 · P95 417s · gaps published</text>

  <text x="52" y="792" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">A consistent package proves the requested checks passed; it does not certify an investment or credit decision.</text>
</svg>
